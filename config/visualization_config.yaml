# Visualization Configuration - Live View Requirements
# Real-time display with detection boxes and tracking trails

visualization:
  window:
    name: "RSU Fusion - Phase 1 Live View"
    width: 960
    height: 540
    fps_target: 30
    position_x: 100
    position_y: 100
    
  display_elements:
    detection_boxes:
      enabled: true
      color: [0, 255, 0]    # Green for raw detections
      thickness: 2
      show_confidence: true
      font_scale: 0.6
      
    tracking_boxes:
      enabled: true
      color_per_id: true     # Different color per track ID
      show_id_label: true
      thickness: 3
      font_scale: 0.8
      
    tracking_trails:
      enabled: true
      length: 30             # Number of trail points
      fade_effect: true      # Fade older trail points  
      thickness: 2
      alpha_start: 1.0       # Newest point opacity
      alpha_end: 0.2         # Oldest point opacity
      
    info_overlay:
      enabled: true
      fps_counter: true
      detection_count: true
      track_count: true
      timestamp: true
      position: "top_left"   # top_left, top_right, bottom_left, bottom_right
      font_scale: 0.7
      color: [255, 255, 255] # White text
      
  controls:
    quit_key: 'q'
    pause_key: 'p' 
    save_frame_key: 's'
    toggle_trails_key: 't'