# Phase 1 Configuration - RSU Fusion System
# Main configuration file for modular architecture

carla:
  host: "localhost"
  port: 2000
  map: "Town10HD"
  synchronous_mode: true
  fixed_delta_seconds: 0.05
  timeout: 10.0

system:
  debug_mode: true
  log_level: "INFO"
  performance_monitoring: true
  max_fps: 30

# Module-specific configuration files
modules:
  camera: "camera_config.yaml"
  detection: "detection_config.yaml"
  tracking: "tracking_config.yaml"
  visualization: "visualization_config.yaml"
  vehicles: "vehicle_config.yaml"

# Data paths
paths:
  models: "data/models/"
  routes: "data/routes/"
  logs: "data/outputs/logs/"
  recordings: "data/outputs/recordings/"